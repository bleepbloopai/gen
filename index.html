<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imagine</title>
<style>
  :root { --green: #33ff33; --dim: #1f9a1f; }
  * { box-sizing: border-box; }
  html { background: #000; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; background: #000;
    padding: 16px; font-family: "Courier New", Courier, monospace;
  }
  .win {
    width: 100%; max-width: 640px; margin: auto;
    display: flex; flex-direction: column;
    background: #000; border: 1px solid #fff;
  }
  .bar {
    background: #fff; color: #000; padding: 6px 10px;
    font-size: 14px; font-weight: bold; flex: none;
  }
  .body { padding: 16px; color: var(--green); font-size: 15px; line-height: 1.5; }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .row label { flex: none; }
  input, textarea {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--green); font: inherit; caret-color: var(--green); padding: 0;
    border-radius: 0;
  }
  textarea { display: block; resize: none; overflow: hidden; overflow-wrap: anywhere; }
  input::placeholder, textarea::placeholder { color: var(--dim); }
  button {
    margin-top: 12px; background: #000; color: var(--green);
    border: 1px solid var(--green); font: inherit; padding: 4px 12px;
    cursor: pointer; border-radius: 0;
  }
  button:hover:not(:disabled) { background: var(--green); color: #000; }
  button:focus-visible { outline: 1px dashed var(--green); outline-offset: 3px; }
  button:disabled { color: var(--dim); border-color: var(--dim); cursor: default; }
  #out { margin-top: 16px; }
  #out p { margin: 0 0 8px; overflow-wrap: anywhere; }
  #out img { display: block; max-width: 100%; height: auto; border: 1px solid var(--green); }
  #out a { color: var(--green); }
  .savebar { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .savebar button { margin-top: 0; }
  select {
    background: #000; color: var(--green); border: 1px solid var(--green);
    font: inherit; padding: 4px 8px; border-radius: 0;
  }
  select:focus-visible { outline: 1px dashed var(--green); outline-offset: 3px; }
</style>
</head>
<body>
  <div class="win">
    <div class="bar">image generator</div>
    <div class="body">
      <div class="row">
        <label for="p">&gt;</label>
        <textarea id="p" rows="1" placeholder="describe an image" autocomplete="off" spellcheck="false" autofocus></textarea>
      </div>
      <button id="go">generate</button>
      <div id="out"></div>
    </div>
  </div>

<script>
  var input = document.getElementById("p");
  var btn = document.getElementById("go");
  var out = document.getElementById("out");
  var MODEL = "flux";
  var PROXY = "https://snowy-recipe-2e51.bleepbloop-ai.workers.dev"; // paste your worker URL here

  function fileName(text, ext) {
    var name = text.replace(/[\\/:*?"<>|\u0000-\u001f]/g, "").replace(/\s+/g, " ").trim().slice(0, 100).trim();
    name = name.replace(/[. ]+$/, "");
    return (name || "image") + "." + ext;
  }

  function download(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function saveAs(img, original, ext, text) {
    var name = fileName(text, ext);
    if (ext === "jpg") { download(original, name); return; }
    var c = document.createElement("canvas");
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    c.getContext("2d").drawImage(img, 0, 0);
    c.toBlob(function (b) {
      if (b) download(b, name);
    }, "image/" + ext, 0.95);
  }

  function generate() {
    var prompt = input.value.trim();
    if (!prompt) { out.innerHTML = "<p>type a prompt first.</p>"; return; }

    var url = PROXY + "/?prompt=" + encodeURIComponent(prompt) +
              "&model=" + encodeURIComponent(MODEL) +
              "&seed=" + Math.floor(Math.random() * 1e6);

    btn.disabled = true;
    out.innerHTML = "<p>generating...</p>";

    fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error("bad response");
        return r.blob();
      })
      .then(function (blob) {
        var blobUrl = URL.createObjectURL(blob);
        var img = new Image();
        img.alt = prompt;
        img.onload = function () {
          out.innerHTML = "";
          out.appendChild(img);
          var p = document.createElement("p");
          p.style.marginTop = "8px";

          var open = document.createElement("a");
          open.href = blobUrl; open.target = "_blank"; open.rel = "noopener";
          open.textContent = "open full size";

          p.appendChild(open);

          var fmt = document.createElement("select");
          fmt.setAttribute("aria-label", "file type");
          [["jpg","JPG"],["png","PNG"],["webp","WEBP"]].forEach(function (o) {
            var opt = document.createElement("option");
            opt.value = o[0]; opt.textContent = o[1];
            fmt.appendChild(opt);
          });

          var save = document.createElement("button");
          save.textContent = "save as";
          save.onclick = function () { saveAs(img, blob, fmt.value, prompt); };

          var row = document.createElement("div");
          row.className = "savebar";
          row.appendChild(save);
          row.appendChild(fmt);
          p.appendChild(row);
          out.appendChild(p);
          btn.disabled = false;
        };
        img.onerror = function () {
          out.innerHTML = "<p>the image failed to load. check your connection and try again.</p>";
          btn.disabled = false;
        };
        img.src = blobUrl;
      })
      .catch(function () {
        out.innerHTML = "<p>the image failed to load. check your connection and try again.</p>";
        btn.disabled = false;
      });
  }

  btn.addEventListener("click", generate);
  function fit() {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  }
  input.addEventListener("input", fit);
  window.addEventListener("resize", fit);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      if (!btn.disabled) generate();
    }
  });
  fit();
</script>
</body>
</html>
