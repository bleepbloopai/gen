<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imagine</title>
<style>
  :root { --green: #33ff33; --dim: #1f9a1f; }
  * { box-sizing: border-box; }
  html { background: #000; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; background: #000;
    padding: 16px; font-family: "Courier New", Courier, monospace;
  }
  .win {
    width: 100%; max-width: 640px; margin: auto;
    display: flex; flex-direction: column;
    background: #000; border: 1px solid #fff;
  }
  .bar {
    background: #fff; color: #000; padding: 6px 10px;
    font-size: 14px; font-weight: bold; flex: none;
  }
  .body { padding: 16px; color: var(--green); font-size: 15px; line-height: 1.5; }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .row label { flex: none; }
  input, textarea {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--green); font: inherit; caret-color: var(--green); padding: 0;
    border-radius: 0;
  }
  textarea { display: block; resize: none; overflow: hidden; overflow-wrap: anywhere; }
  input::placeholder, textarea::placeholder { color: var(--dim); }
  button {
    background: #000; color: var(--green);
    border: 1px solid var(--green); font: inherit; padding: 4px 12px;
    cursor: pointer; border-radius: 0;
  }
  button:hover:not(:disabled) { background: var(--green); color: #000; }
  button:focus-visible { outline: 1px dashed var(--green); outline-offset: 3px; }
  button:disabled { color: var(--dim); border-color: var(--dim); cursor: default; }
  select {
    background: #000; color: var(--green); border: 1px solid var(--green);
    font: inherit; padding: 4px 8px; border-radius: 0;
  }
  select:focus-visible { outline: 1px dashed var(--green); outline-offset: 3px; }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  #out { margin-top: 16px; }
  #out p { margin: 0 0 8px; overflow-wrap: anywhere; }
  #out img { display: block; max-width: 100%; height: auto; border: 1px solid var(--green); }
  #out a { color: var(--green); }
  .result { margin-bottom: 24px; }
  .result:last-child { margin-bottom: 0; }
  .links { margin-top: 8px; }
  .savebar { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
</style>
</head>
<body>
  <div class="win">
    <div class="bar">image generator</div>
    <div class="body">
      <div class="row">
        <label for="p">&gt;</label>
        <textarea id="p" rows="1" placeholder="describe an image" autocomplete="off" spellcheck="false" autofocus></textarea>
      </div>
      <div class="actions">
        <button id="go">generate</button>
        <select id="n" aria-label="number of images">
          <option value="1">1 image</option>
          <option value="2">2 images</option>
          <option value="3">3 images</option>
          <option value="4">4 images</option>
        </select>
      </div>
      <div id="out"></div>
    </div>
  </div>

<script>
  var input = document.getElementById("p");
  var btn = document.getElementById("go");
  var countSel = document.getElementById("n");
  var out = document.getElementById("out");
  var MODEL = "flux";
  var PROXY = "https://snowy-recipe-2e51.bleepbloop-ai.workers.dev"; // paste your worker URL here

  function fileName(text, ext) {
    var name = text.replace(/[\\/:*?"<>|\u0000-\u001f]/g, "").replace(/\s+/g, " ").trim().slice(0, 100).trim();
    name = name.replace(/[. ]+$/, "");
    return (name || "image") + "." + ext;
  }

  function download(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function saveAs(img, original, ext, text) {
    var name = fileName(text, ext);
    if (ext === "jpg") { download(original, name); return; }
    var c = document.createElement("canvas");
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    c.getContext("2d").drawImage(img, 0, 0);
    c.toBlob(function (b) {
      if (b) download(b, name);
    }, "image/" + ext, 0.95);
  }

  function loadImage(blob) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () { resolve({ img: img, blob: blob, url: url }); };
      img.onerror = function () { reject(new Error("the image data was corrupt or unreadable.")); };
      img.src = url;
    });
  }

  // Requests one image and rejects with a message that says what actually went wrong.
  function requestOne(prompt) {
    var url = PROXY + "/?prompt=" + encodeURIComponent(prompt) +
              "&model=" + encodeURIComponent(MODEL) +
              "&seed=" + Math.floor(Math.random() * 1e6);

    return fetch(url).then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) {
          throw new Error((t.trim().slice(0, 300) || "empty error message") + " (HTTP " + r.status + ")");
        });
      }
      var type = r.headers.get("Content-Type") || "";
      if (type.indexOf("image/") !== 0) {
        throw new Error("the server sent " + (type || "an unknown content type") +
          " instead of an image. the worker address in this file may point at the wrong worker.");
      }
      return r.blob();
    }, function () {
      throw new Error("could not reach the worker. check your internet connection and the worker address in this file.");
    }).then(loadImage);
  }

  function buildResult(res, prompt, index, total) {
    var box = document.createElement("div");
    box.className = "result";
    res.img.alt = prompt;
    box.appendChild(res.img);

    var links = document.createElement("p");
    links.className = "links";
    var open = document.createElement("a");
    open.href = res.url; open.target = "_blank"; open.rel = "noopener";
    open.textContent = "open full size";
    links.appendChild(open);
    box.appendChild(links);

    var fmt = document.createElement("select");
    fmt.setAttribute("aria-label", "file type");
    [["jpg", "JPG"], ["png", "PNG"], ["webp", "WEBP"]].forEach(function (o) {
      var opt = document.createElement("option");
      opt.value = o[0]; opt.textContent = o[1];
      fmt.appendChild(opt);
    });

    var save = document.createElement("button");
    save.textContent = "save as";
    var nameBase = total > 1 ? prompt + " " + (index + 1) : prompt;
    save.onclick = function () { saveAs(res.img, res.blob, fmt.value, nameBase); };

    var bar = document.createElement("div");
    bar.className = "savebar";
    bar.appendChild(save);
    bar.appendChild(fmt);
    box.appendChild(bar);
    return box;
  }

  function generate() {
    var prompt = input.value.trim();
    if (!prompt) { out.innerHTML = "<p>type a prompt first.</p>"; return; }

    var count = parseInt(countSel.value, 10) || 1;
    btn.disabled = true;
    countSel.disabled = true;
    out.innerHTML = "";
    var status = document.createElement("p");
    status.textContent = "generating " + count + (count === 1 ? " image..." : " images...");
    out.appendChild(status);

    var jobs = [];
    for (var i = 0; i < count; i++) {
      jobs.push(requestOne(prompt).then(
        function (res) { return { ok: true, res: res }; },
        function (err) { return { ok: false, msg: err.message }; }
      ));
    }

    Promise.all(jobs).then(function (results) {
      out.innerHTML = "";

      // Group identical errors so the reason is shown once.
      var errors = {};
      results.forEach(function (r) { if (!r.ok) errors[r.msg] = (errors[r.msg] || 0) + 1; });
      Object.keys(errors).forEach(function (msg) {
        var p = document.createElement("p");
        var prefix = count > 1 ? errors[msg] + " of " + count + " failed: " : "failed: ";
        p.textContent = prefix + msg;
        out.appendChild(p);
      });

      results.forEach(function (r, idx) {
        if (r.ok) out.appendChild(buildResult(r.res, prompt, idx, count));
      });

      btn.disabled = false;
      countSel.disabled = false;
    });
  }

  function fit() {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  }

  btn.addEventListener("click", generate);
  input.addEventListener("input", fit);
  window.addEventListener("resize", fit);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      if (!btn.disabled) generate();
    }
  });
  fit();
</script>
</body>
</html>
